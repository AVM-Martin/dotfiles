- defaults:
    link:
      create: true
      relink: true
      glob: true

- link:
    ~/.editorconfig: .editorconfig
    ~/.zshenv: .zshenv
    ~/.config/:
      path: .config/*
      exclude: [".config/dotbot"]
    ~/.local/lib: .local/lib/*
    ~/.local/script: .local/script/*
    ~/.local/share:
      path: .local/share/*
      exclude: [".local/share/dotfiles"]

- shell:
    - description: Run bootstrap scripts
      command: "$HOME/.config/dotfiles/bootstrap.bash"
      stdout: true
      stderr: true
